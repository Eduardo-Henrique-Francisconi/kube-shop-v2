<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <rect width="1000" height="620" fill="#ffffff"/>
  <!-- Users and GitHub -->
  <rect x="20" y="70" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="85" y="96" text-anchor="middle" font-weight="bold">Usuários</text>
  <text x="85" y="114" text-anchor="middle" font-size="11">navegador (HTTP 80)</text>
  <rect x="20" y="420" width="130" height="110" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="85" y="444" text-anchor="middle" font-weight="bold">GitHub Actions</text>
  <text x="85" y="463" text-anchor="middle" font-size="11">deploy / ops / destroy</text>
  <text x="85" y="479" text-anchor="middle" font-size="11">Terraform + Ansible</text>
  <text x="85" y="495" text-anchor="middle" font-size="11">SSH temporário (JIT)</text>
  <text x="85" y="511" text-anchor="middle" font-size="11">Secrets por ambiente</text>
  <rect x="20" y="250" width="130" height="60" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="85" y="276" text-anchor="middle" font-weight="bold">GHCR</text>
  <text x="85" y="294" text-anchor="middle" font-size="11">imagens api/frontend</text>
  <!-- Azure -->
  <rect x="190" y="20" width="790" height="580" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-dasharray="6 4"/>
  <text x="205" y="42" font-weight="bold" fill="#1d4ed8">Microsoft Azure · eastus2 (assinatura)</text>
  <rect x="210" y="55" width="550" height="440" rx="10" fill="#ffffff" stroke="#1d4ed8"/>
  <text x="225" y="76" font-weight="bold" fill="#1d4ed8">rg-kubeshop-&lt;env&gt; · VNet 10.20.0.0/16</text>
  <!-- App subnet -->
  <rect x="230" y="90" width="240" height="390" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="245" y="110" font-weight="bold" fill="#047857">snet-app 10.20.1.0/24</text>
  <text x="245" y="127" font-size="11" fill="#047857">NSG: 80 público · 22 só IP do runner/admin</text>
  <rect x="250" y="145" width="200" height="40" rx="6" fill="#d1fae5" stroke="#047857"/>
  <text x="350" y="163" text-anchor="middle" font-weight="bold">IP público estático</text>
  <text x="350" y="178" text-anchor="middle" font-size="10">&lt;env&gt;-xxxx.eastus2.cloudapp.azure.com</text>
  <rect x="250" y="200" width="200" height="260" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="350" y="222" text-anchor="middle" font-weight="bold">VM 1 · Aplicação</text>
  <text x="350" y="238" text-anchor="middle" font-size="11">vm-kubeshop-app-&lt;env&gt; · 10.20.1.10</text>
  <text x="350" y="253" text-anchor="middle" font-size="11">Ubuntu 24.04 · Docker</text>
  <rect x="270" y="268" width="160" height="54" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="350" y="290" text-anchor="middle">frontend</text>
  <text x="350" y="307" text-anchor="middle" font-size="11">React + Nginx · 80→8080</text>
  <rect x="270" y="340" width="160" height="54" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="350" y="362" text-anchor="middle">api</text>
  <text x="350" y="379" text-anchor="middle" font-size="11">Node.js/Express · 3000 (interno)</text>
  <text x="350" y="420" text-anchor="middle" font-size="11">rede Docker kubeshop_web</text>
  <text x="350" y="436" text-anchor="middle" font-size="11">bastion SSH para o banco</text>
  <line x1="350" y1="322" x2="350" y2="338" stroke="#334155" marker-end="url(#a)"/>
  <!-- DB subnet -->
  <rect x="500" y="90" width="240" height="390" rx="8" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="515" y="110" font-weight="bold" fill="#b91c1c">snet-db 10.20.2.0/24 (privada)</text>
  <text x="515" y="127" font-size="11" fill="#b91c1c">NSG: 27017 e 22 só de 10.20.1.10</text>
  <text x="515" y="142" font-size="11" fill="#b91c1c">demais entradas: Deny · sem IP público</text>
  <rect x="520" y="200" width="200" height="260" rx="6" fill="#ffffff" stroke="#b91c1c"/>
  <text x="620" y="222" text-anchor="middle" font-weight="bold">VM 2 · Banco (exclusiva)</text>
  <text x="620" y="238" text-anchor="middle" font-size="11">vm-kubeshop-db-&lt;env&gt; · 10.20.2.10</text>
  <rect x="540" y="268" width="160" height="54" rx="5" fill="#fff1f2" stroke="#e11d48"/>
  <text x="620" y="290" text-anchor="middle">mongo 8.0 (autenticado)</text>
  <text x="620" y="307" text-anchor="middle" font-size="11">publicado só em 10.20.2.10:27017</text>
  <rect x="540" y="340" width="160" height="40" rx="5" fill="#fff7ed" stroke="#c2410c"/>
  <text x="620" y="358" text-anchor="middle">Disco gerenciado 16 GiB</text>
  <text x="620" y="373" text-anchor="middle" font-size="11">/data/mongo (LUN 0)</text>
  <rect x="540" y="392" width="160" height="40" rx="5" fill="#f8fafc" stroke="#475569"/>
  <text x="620" y="410" text-anchor="middle">timer de backup diário</text>
  <text x="620" y="425" text-anchor="middle" font-size="11">mongodump → Blob (SAS)</text>
  <line x1="620" y1="322" x2="620" y2="338" stroke="#334155" marker-end="url(#a)"/>
  <!-- api -> mongo -->
  <path d="M430,367 C475,367 490,300 538,295" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="470" y="395" text-anchor="middle" font-size="11">rede privada</text>
  <!-- Shared -->
  <rect x="780" y="55" width="185" height="210" rx="10" fill="#fffbeb" stroke="#b45309"/>
  <text x="872" y="78" text-anchor="middle" font-weight="bold" fill="#b45309">rg-kubeshop-shared</text>
  <text x="872" y="96" text-anchor="middle" font-size="11">Storage Account (bootstrap)</text>
  <rect x="795" y="110" width="155" height="55" rx="5" fill="#ffffff" stroke="#b45309"/>
  <text x="872" y="132" text-anchor="middle">tfstate</text>
  <text x="872" y="150" text-anchor="middle" font-size="11">lease lock · versões</text>
  <rect x="795" y="178" width="155" height="70" rx="5" fill="#ffffff" stroke="#b45309"/>
  <text x="872" y="200" text-anchor="middle">backups-&lt;env&gt;</text>
  <text x="872" y="217" text-anchor="middle" font-size="11">retenção 30 dias</text>
  <text x="872" y="233" text-anchor="middle" font-size="11">sobrevive ao destroy</text>
  <path d="M700,412 C760,412 760,230 793,215" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- Public block -->
  <rect x="780" y="290" width="185" height="120" rx="10" fill="#ffffff" stroke="#b91c1c"/>
  <text x="872" y="313" text-anchor="middle" font-weight="bold" fill="#b91c1c">Bloqueado</text>
  <text x="872" y="333" text-anchor="middle" font-size="11">Internet → 27017: Deny</text>
  <text x="872" y="350" text-anchor="middle" font-size="11">Internet → VM do banco:</text>
  <text x="872" y="366" text-anchor="middle" font-size="11">sem IP público</text>
  <text x="872" y="383" text-anchor="middle" font-size="11">SSH fora da pipeline: Deny</text>
  <!-- arrows outside -->
  <path d="M150,100 C200,100 210,165 248,165" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M150,280 C200,280 210,300 268,300" fill="none" stroke="#334155" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="200" y="320" font-size="11">docker pull</text>
  <path d="M150,470 C215,470 215,180 248,175" fill="none" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="160" y="545" font-size="11" fill="#7c3aed">SSH (ProxyJump → banco)</text>
  <path d="M150,500 C400,560 760,560 790,150" fill="none" stroke="#7c3aed" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="560" y="575" font-size="11" fill="#7c3aed">terraform state (backend azurerm)</text>
</svg>
