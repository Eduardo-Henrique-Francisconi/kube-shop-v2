name: Terraform init
description: Instala o Terraform, autentica o Azure CLI e inicializa o state remoto do ambiente. Requer ARM_* e TF_VAR_backup_storage_account no job.
inputs:
  environment:
    description: dev, homolog ou prod
    required: true
runs:
  using: composite
  steps:
    - name: Instalar Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.8"
        terraform_wrapper: false

    - name: Login no Azure CLI (service principal)
      shell: bash
      run: |
        az login --service-principal --username "$ARM_CLIENT_ID" --password "$ARM_CLIENT_SECRET" \
          --tenant "$ARM_TENANT_ID" --output none
        az account set --subscription "$ARM_SUBSCRIPTION_ID"
        echo "Azure CLI autenticado na assinatura configurada"

    - name: terraform init (state remoto do ambiente ${{ inputs.environment }})
      shell: bash
      working-directory: terraform
      run: |
        terraform init -input=false -no-color \
          -backend-config="resource_group_name=${SHARED_RG}" \
          -backend-config="storage_account_name=${TF_VAR_backup_storage_account}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=kubeshop-${{ inputs.environment }}.tfstate"

