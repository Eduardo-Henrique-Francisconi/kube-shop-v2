---
# Rotina: backup sob demanda (o mesmo script do timer diário)
- name: Backup do MongoDB
  hosts: db
  become: true
  tasks:
    - name: Executar backup
      ansible.builtin.command: /usr/local/bin/kubeshop-backup
      register: ops_backup
      changed_when: true
    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ ops_backup.stdout_lines }}"
